services:
  test:
    build:
      context: .
      dockerfile: Dockerfile
      target: test
    container_name: weather-forecast-test

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: weather-forecast-api
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
    restart: unless-stopped
    depends_on:
      - test